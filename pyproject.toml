[project]
name = "coad_parser"
version = "0.1.0"
description = "Extração de dados de documentos HTML da COAD/ICMBio"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "lxml",
    "pandas",
    "pydantic",
    "openpyxl",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coad_parser = ["data/*.csv", "data/*.md"]
